[project]
name = "docile-benchmark"
version = "0.3.5"
description = "Tools to work with the DocILE dataset and benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Stepan Simsa", email = "stepan.simsa@rossum.ai" },
    { name = "Matyas Skalicky", email = "matyas.skalicky@rossum.ai" },
    { name = "Milan Sulc", email = "milan.sulc@rossum.ai" },
    { name = "Michal Uricar", email = "michal.uricar@rossum.ai" },
    { name = "Matej Kocian", email = "matej.kocian@rossum.ai" },
    { name = "Yash Patel", email = "patelyas@fel.cvut.cz" },
]
dependencies = [
    "tqdm>=4.66,<5",
    "pdf2image>=1.17,<2",
    "pillow>=10.0,<13",
    "networkx[default]>=3.3,<4",
    "tabulate>=0.9.0,<0.10",
    "click>=8.2,<9",
]

[project.urls]
homepage = "https://docile.rossum.ai/"
repository = "https://github.com/rossumai/docile"

[project.optional-dependencies]
interactive = [
    "jupyterlab>=4.0,<5",
    "ipywidgets>=8.0.4,<9",
    "plotly>=5.12,<7",
]
ocr = [
    "python-doctr>=0.11,<1",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
    "opencv-python>=4.6.0.66,<5",
]
baselines = [
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
    "transformers[torch]>=4.57,<5",
    "datasets>=4,<5",
    "torchmetrics>=1.9,<2",
    "sentencepiece>=0.2.1,<0.3",
    "tensorboard>=2.11.2,<3",
    "scikit-learn>=1.7,<2",
    "pytorch-lightning[extra]>=2.6,<3",
    "timm>=0.6.11,<2",
    "botocore>=1.38,<2",
    "aiobotocore>=2.23,<3",
    "dill>=0.4.1",
]

[project.scripts]
docile_evaluate = "docile.cli.evaluate:evaluate"
docile_print_evaluation_report = "docile.cli.evaluate:print_evaluation_report"

[dependency-groups]
dev = [
    "pre-commit>=4.0,<5",
    "pytest>=8.0,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Enforce CUDA 12 (cu126) builds of PyTorch from the official PyTorch wheel index.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.hatch.build.targets.wheel]
packages = ["docile"]

[tool.mypy]
pretty = true
show_error_codes = true
disallow_untyped_defs = true
warn_return_any = false
namespace_packages = true
ignore_missing_imports = true
disable_error_code = ["operator", "index", "var-annotated"]

[tool.codespell]
skip = "*.ipynb,tests/data/*"
# Using lower case for doubleClick: https://github.com/codespell-project/codespell/issues/2375
ignore-words-list = "doubleclick"
